[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test

# --no-migrations builds the test schema directly from the models instead of replaying the
# migration history. Required here, not a shortcut: migration 0013 truncates Aadhaar numbers with
# RIGHT(REGEXP_REPLACE(...)), which is PostgreSQL-specific SQL and cannot run against the SQLite
# test database (see conftest.py for why the tests use SQLite at all). The trade-off is that these
# tests verify the models rather than the migration history; `manage.py makemigrations --check` is
# what guards the latter, and belongs in CI next to this.
addopts = --no-migrations --strict-markers -ra

python_files = test_*.py
testpaths = api/tests

# Surface unexpected warnings instead of letting them scroll past. anymail's notice about
# dropping SendGrid support is upstream and not actionable here.
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*SendGrid.*:UserWarning
