# Serves the built SPA and reverse-proxies the API on the same origin.
#
# Same-origin is the point. When the frontend and API share an origin: no CORS preflight is
# needed at all, and the refresh-token cookie's SameSite=Strict works as intended. Splitting
# them across two hostnames is what makes that cookie a hazard (a genuinely cross-site pair
# means the browser silently withholds it on every refresh, logging users out mid-session with
# no error). Keeping them together removes the problem instead of configuring around it.

upstream backend {
    # Docker's embedded DNS resolves this to the backend service. max_fails=0 disables passive
    # ejection: with a single upstream, ejecting it just turns a recoverable blip into a hard
    # 502 for the whole ejection window.
    server backend:8000 max_fails=0;
}

server {
    listen 8080;
    server_name _;

    # Uploaded candidate spreadsheets and exam recording chunks both POST bodies larger than
    # nginx's 1MB default, which would otherwise be rejected here before reaching Django (which
    # enforces its own 10MB cap - see DATA_UPLOAD_MAX_MEMORY_SIZE).
    client_max_body_size 12m;

    # Do not advertise the nginx version in Server: or on error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The API sets its own on JSON responses; these cover the HTML shell.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Camera and microphone are required by the exam's identity capture and session recording,
    # so they are allowed for this origin only. Everything else is denied outright.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # X-Forwarded-For is SET, not appended, so a client-supplied value cannot be smuggled
        # through. Django only trusts this header when TRUST_X_FORWARDED_FOR=True, and that
        # setting is only safe precisely because this line overwrites whatever the client sent.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # Matches the gunicorn timeout, so a slow spreadsheet import is not cut off here first.
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        # Streams request bodies straight through instead of buffering them to disk first -
        # matters for the ~10s exam recording chunks.
        proxy_request_buffering off;
    }

    # Hashed asset filenames (Vite fingerprints them) can be cached indefinitely: a changed file
    # gets a new name, so a stale cache entry is never served for new content.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        # SPA fallback. Every client-side route - including the candidate assessment links at
        # /t/<token> - must return index.html rather than 404, because those paths exist only in
        # the React router. Without this, a candidate opening their emailed link gets a 404.
        try_files $uri $uri/ /index.html;
        # The shell itself must never be cached, or a deploy leaves browsers loading an old
        # index.html that references asset filenames which no longer exist.
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
