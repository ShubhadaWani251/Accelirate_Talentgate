# CI/CD for AcceliAssess.
#
# The app deploys as ONE App Service: gunicorn serves the Django API and, via WhiteNoise, the
# built React bundle from the same origin. That is not a packaging convenience - the refresh
# token rides in a SameSite cookie the browser withholds across sites, so splitting the frontend
# onto its own hostname logs users out mid-session. See config/spa.py and Frontend/nginx.conf.
# The practical consequence for this file: the frontend build is copied *into* the backend
# artifact rather than published anywhere separately.

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

variables:
  # Matches Backend/Dockerfile and the App Service runtime, so a dependency that resolves
  # differently across minor versions fails in CI rather than only after deployment.
  pythonVersion: '3.13'
  nodeVersion: '24.x'
  # Staging defaults. The production stage below overrides the connection and the app name.
  # Each identity's only role is Website Contributor on its own app, so a stage cannot deploy
  # the other environment, and neither can touch the rest of the shared resource group.
  # Both connections are validated when a main run is queued, including one whose production
  # stage nobody starts.
  azureServiceConnection: 'Aptitude-Staging'
  resourceGroupName: 'AccelirateInternalProjects'
  webAppName: 'app-aptitude-stg-eastus'
  # Microsoft sign-in. Both are the Entra app registration's public identifiers - an
  # application id and a directory id, neither secret and neither usable on its own, which is
  # why they sit here in plain sight next to the app name rather than in a variable group.
  #
  # Blank disables the feature rather than half-enabling it (see the build step below). Fill
  # them in once the registration exists; the BACKEND half is separate and lives in each App
  # Service's own settings as SSO_ENABLED / SSO_CLIENT_ID / SSO_TENANT_ID, because that half
  # is read at runtime and must be able to differ per environment.
  ssoClientId: ''
  ssoTenantId: ''

stages:
  - stage: CI
    displayName: Build and test
    jobs:
      - job: BackendTests
        displayName: Backend tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: |
              set -e
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              # rapidocr-onnxruntime is deliberately not in requirements.txt - see that file's own
              # comment. --no-deps here mirrors exactly what Backend/startup.sh does in
              # production, so CI's dependency set matches what App Service actually runs instead
              # of masking the opencv-python conflict that caused the 2026-09-10 outage.
              pip install --no-deps rapidocr-onnxruntime==1.2.3
            workingDirectory: Backend
            displayName: Install backend dependencies

          - script: |
              set -e
              if pip show opencv-python >/dev/null 2>&1; then
                echo "##vso[task.logissue type=error]opencv-python (the GUI build) got installed \
              alongside opencv-python-headless. This is what took down the whole App Service on \
              2026-09-10 (cv2 ends up needing libGL.so.1, which the Linux runtime doesn't have). \
              Whatever dependency change pulled this in needs --no-deps or an equivalent fix - see \
              Backend/requirements.in's comment on rapidocr-onnxruntime for the full story."
                exit 1
              fi
            workingDirectory: Backend
            displayName: Guard against opencv-python (non-headless) sneaking back in

          - script: |
              set -e
              DJANGO_SETTINGS_MODULE=config.settings_test python manage.py makemigrations --check --dry-run
            workingDirectory: Backend
            displayName: Guard against uncommitted model changes
            # The suite runs with --no-migrations (migration 0013 contains PostgreSQL-only SQL
            # that cannot run on SQLite), so it builds the schema straight from the models and
            # never exercises the migration history. That leaves exactly one way for a model
            # change to reach main without its migration: nobody notices. This check is what
            # notices - it fails the build if models/ and migrations/ have drifted apart.
            # settings_test is used because it is self-contained (its own SECRET_KEY, in-memory
            # SQLite), so this needs no database and no secrets in CI.

          - script: |
              set -e
              python -m pytest -q --junitxml=$(Build.ArtifactStagingDirectory)/pytest.xml
            workingDirectory: Backend
            displayName: Run pytest
            # pytest.ini points at config.settings_test, which uses in-memory SQLite. No database
            # service or secret is needed here, and none should be added - the suite is designed
            # never to touch the shared Postgres.

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/pytest.xml'
              testRunTitle: 'Backend pytest'

      - job: Package
        displayName: Build frontend and package app
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseNode@1
            displayName: Use Node $(nodeVersion)
            inputs:
              # 'version', not 'versionSpec' as UsePythonVersion@0 above takes. UseNode@1 renamed
              # the input and ignores unknown ones silently, so versionSpec here does not fail the
              # task - it falls back to the default Node 10.x and the build breaks much later.
              version: '$(nodeVersion)'

          - script: npm ci
            workingDirectory: Frontend
            displayName: Install frontend dependencies

          - script: npm run lint
            workingDirectory: Frontend
            displayName: Lint frontend
            # Blocking, so a new violation can't reach main. The two React Compiler rules that
            # the existing code does not satisfy are switched off in Frontend/eslint.config.js
            # with the reasoning, rather than the whole run being made advisory here.

          - script: npm run build
            workingDirectory: Frontend
            displayName: Build frontend
            env:
              # Relative, not absolute: the API is same-origin now, so the bundle must not bake in
              # a hostname. This is also what Frontend/Dockerfile passes for the nginx stack.
              VITE_API_BASE_URL: /api
              # Microsoft sign-in, and it has to be HERE rather than in App Service settings:
              # Vite inlines import.meta.env at BUILD time, so a value set on the web app arrives
              # long after the bundle that needed it was written.
              #
              # One pair of values covers both environments. The client id is per app
              # REGISTRATION, not per deployment, and staging and production promote the same
              # artifact - what differs between them is window.location.origin at runtime, which
              # is why the registration carries a redirect URI for each.
              #
              # Empty until the registration exists, which is the safe state rather than a
              # broken one: src/features/auth/msal.isSsoConfigured() returns false, the login
              # screen shows the password form alone, and nothing on it is half-wired.
              VITE_SSO_CLIENT_ID: $(ssoClientId)
              VITE_SSO_TENANT_ID: $(ssoTenantId)

          - script: |
              set -e
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"

              # Everything the app needs at runtime, and nothing that is either local state or
              # rebuilt on the server. requirements.txt has to survive: Oryx reads it on the
              # App Service side to install dependencies during deployment.
              rsync -a \
                --exclude 'venv/' \
                --exclude '__pycache__/' \
                --exclude '*.pyc' \
                --exclude '.env' \
                --exclude 'media/' \
                --exclude 'logs/' \
                --exclude 'staticfiles/' \
                Backend/ "$STAGE/"

              # The React bundle lands where FRONTEND_DIST expects it (Backend/frontend/), which
              # is how WhiteNoise and config/spa.py find index.html and the hashed assets.
              mkdir -p "$STAGE/frontend"
              cp -r Frontend/dist/. "$STAGE/frontend/"

              test -f "$STAGE/manage.py"
              test -f "$STAGE/frontend/index.html"
            displayName: Assemble single-origin deployment package

          - task: ArchiveFiles@2
            displayName: Archive package
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/acceliassess.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: Publish package artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/acceliassess.zip'
              artifact: acceliassess

  - stage: DeployStaging
    displayName: Deploy to staging
    dependsOn: CI
    # Only main deploys. Feature branches still get the full build and test run above, which is
    # the point of triggering on them.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployWebApp
        displayName: Deploy App Service
        pool:
          vmImage: ubuntu-latest
        # Still the old product name, deliberately: this names an Azure DevOps Environment that
        # exists under that name and carries the required-approver check. Renaming it here
        # creates a SECOND, unapproved environment rather than renaming the first, so the
        # deployment gate would silently stop applying. Rename it in Azure DevOps first.
        environment: talentgate-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: acceliassess

                - task: AzureWebApp@1
                  displayName: Deploy to $(webAppName)
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(webAppName)'
                    resourceGroupName: '$(resourceGroupName)'
                    package: '$(Pipeline.Workspace)/acceliassess/acceliassess.zip'
                    # Runs migrations and collectstatic before handing off to gunicorn. App Service
                    # never runs docker-entrypoint.sh on a code deployment, so this script is the
                    # only thing that applies migrations - see Backend/startup.sh.
                    startUpCommand: 'sh startup.sh'

  # Staging is the only environment this file deploys, and Aptitude-Staging is the only service
  # connection it names. That is load-bearing, not incidental: Azure DevOps validates EVERY
  # connection a run's YAML names when the run is queued, before any stage's condition is
  # evaluated and before a run record exists. A name it cannot resolve therefore does not fail
  # a build - it stops the build from being created at all, for every push to main and
  # feature/*, with nothing in the runs list to open and no useful notification.
  #
  # A DeployProduction stage naming Aptitude-Production was added in d5b2cd0 on 2026-10-05 and
  # removed in 32ca91d, because naming that connection stopped runs from being created at all.
  # It is restored below, now that the connection has been confirmed to resolve - validated
  # against the pipeline preview API before this was pushed, precisely so that confirming it
  # did not mean finding out the expensive way.

  # Manual on purpose. Depending on staging and waiting for its approval would raise a
  # production approval on every push to main. This stage stays idle until someone opens a main
  # run whose staging deploy succeeded and starts it, which deploys that run's artifact again.
  # App settings on the production app supply its own database, storage and secrets; nothing in
  # the artifact is environment-specific.
  - stage: DeployProduction
    displayName: Deploy to production
    # No dependsOn, deliberately. Azure DevOps rejects the whole file if a `trigger: manual`
    # stage declares one - "Manually triggered stages cannot have dependencies" - and it
    # rejects it at trigger time, before a run record exists. The symptom is therefore not a
    # failed build but pushes to main and feature/* that silently build nothing at all, with
    # no run to open and no notification worth the name. Do not add it back to express
    # ordering: the comment above IS the ordering, and a person applies it by choosing which
    # run to start this from. This is what fd1ea7c had to fix once already.
    #
    # succeeded() consequently has no upstream stage to report on and does not gate this on
    # staging. The manual trigger and the branch check beside it are the real guards.
    trigger: manual
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      azureServiceConnection: 'Aptitude-Production'
      webAppName: 'app-aptitude-prod-eastus'
    jobs:
      - deployment: DeployProdWebApp
        displayName: Deploy App Service
        pool:
          vmImage: ubuntu-latest
        environment: talentgate-production
        strategy:
          runOnce:
            deploy:
              steps:
                # The artifact this run already built and already deployed to staging - not a
                # rebuild. Renamed from `talentgate` in 66a267c, so a straight revert of the
                # old stage would have failed here looking for an artifact that no longer
                # exists under that name.
                - download: current
                  artifact: acceliassess

                - task: AzureWebApp@1
                  displayName: Deploy to $(webAppName)
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(webAppName)'
                    resourceGroupName: '$(resourceGroupName)'
                    package: '$(Pipeline.Workspace)/acceliassess/acceliassess.zip'
                    startUpCommand: 'sh startup.sh'
